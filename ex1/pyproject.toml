[project]
name = "loading"
version = "0.1.0"
description = "installing dependencies"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<4.0",
    "numpy>=2.0,<3.0",
    "matplotlib>=3.0,<4.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pandas-stubs (>=3.0.5.260730,<4.0.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
